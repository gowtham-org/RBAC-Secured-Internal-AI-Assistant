apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rolechat
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gowtham-org/RBAC-Secured-Internal-AI-Assistant.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: rolechat
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true