apiVersion: v1
kind: ConfigMap
metadata:
  name: rolechat-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  rolechat-overview.json: "{\n  \"uid\": \"rolechat-overview\",\n  \"title\": \"RoleChat / Overview\",\n  \"tags\": [\n    \"rolechat\",\n    \"slo\"\n  ],\n  \"timezone\": \"browser\",\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"editable\": true,\n  \"refresh\": \"30s\",\n  \"time\": {\n    \"from\": \"now-3h\",\n    \"to\": \"now\"\n  },\n  \"templating\": {\n    \"list\": [\n      {\n        \"name\": \"datasource\",\n        \"label\": \"Data source\",\n        \"type\": \"datasource\",\n        \"query\": \"prometheus\",\n        \"current\": {},\n        \"hide\": 0\n      }\n    ]\n  },\n  \"annotations\": {\n    \"list\": []\n  },\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"type\": \"stat\",\n      \"title\": \"Chat requests / min\",\n      \"description\": \"Successful + failed /chat requests, per minute.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 0,\n        \"w\": 6,\n        \"h\": 4\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"sum(rate(http_requests_total{job=\\\"rolechat-backend\\\",handler=\\\"/chat\\\"}[$__rate_interval])) * 60\",\n          \"legendFormat\": \"\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"noValue\": \"no data\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"auto\"\n      }\n    },\n    {\n      \"id\": 2,\n      \"type\": \"stat\",\n      \"title\": \"Server error ratio (5xx)\",\n      \"description\": \"Only 5xx counts as a failure. 401s are user mistakes, not service failures.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"x\": 6,\n        \"y\": 0,\n        \"w\": 6,\n        \"h\": 4\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"(sum(rate(http_requests_total{job=\\\"rolechat-backend\\\",handler=\\\"/chat\\\",status=\\\"5xx\\\"}[$__rate_interval])) or vector(0)) / sum(rate(http_requests_total{job=\\\"rolechat-backend\\\",handler=\\\"/chat\\\"}[$__rate_interval]))\",\n          \"legendFormat\": \"\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\",\n          \"noValue\": \"no data\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"orange\",\n                \"value\": 0.01\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 0.05\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"auto\"\n      }\n    },\n    {\n      \"id\": 3,\n      \"type\": \"stat\",\n      \"title\": \"Chat p95 latency\",\n      \"description\": \"Whole /chat request: login check + retrieval + Gemini.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 0,\n        \"w\": 6,\n        \"h\": 4\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"histogram_quantile(0.95, sum by (le) (rate(rag_chat_seconds_bucket{job=\\\"rolechat-backend\\\"}[$__rate_interval])))\",\n          \"legendFormat\": \"\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\",\n          \"noValue\": \"no data\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"orange\",\n                \"value\": 5\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 10\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"auto\"\n      }\n    },\n    {\n      \"id\": 4,\n      \"type\": \"stat\",\n      \"title\": \"Failed logins (1h)\",\n      \"description\": \"Bad username or password attempts. A sudden jump can mean someone is guessing passwords.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"x\": 18,\n        \"y\": 0,\n        \"w\": 6,\n        \"h\": 4\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"sum(increase(rag_access_denied_total{job=\\\"rolechat-backend\\\"}[1h]))\",\n          \"legendFormat\": \"\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"noValue\": \"no data\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"orange\",\n                \"value\": 20\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 100\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"auto\"\n      }\n    },\n    {\n      \"id\": 5,\n      \"type\": \"timeseries\",\n      \"title\": \"Chat latency (p50 / p95 / p99)\",\n      \"description\": \"End-to-end /chat time. Red line = 5s.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 4,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"histogram_quantile(0.5, sum by (le) (rate(rag_chat_seconds_bucket{job=\\\"rolechat-backend\\\"}[$__rate_interval])))\",\n          \"legendFormat\": \"p50\",\n          \"refId\": \"A\"\n        },\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"histogram_quantile(0.95, sum by (le) (rate(rag_chat_seconds_bucket{job=\\\"rolechat-backend\\\"}[$__rate_interval])))\",\n          \"legendFormat\": \"p95\",\n          \"refId\": \"B\"\n        },\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"histogram_quantile(0.99, sum by (le) (rate(rag_chat_seconds_bucket{job=\\\"rolechat-backend\\\"}[$__rate_interval])))\",\n          \"legendFormat\": \"p99\",\n          \"refId\": \"C\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\",\n          \"custom\": {\n            \"lineWidth\": 2,\n            \"fillOpacity\": 8,\n            \"spanNulls\": true,\n            \"showPoints\": \"auto\",\n            \"stacking\": {\n              \"mode\": \"none\",\n              \"group\": \"A\"\n            },\n            \"thresholdsStyle\": {\n              \"mode\": \"line\"\n            }\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 5\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      }\n    },\n    {\n      \"id\": 6,\n      \"type\": \"timeseries\",\n      \"title\": \"Where the time goes: retrieval vs Gemini\
    \ (p95)\",\n      \"description\": \"If total latency is high, this shows whether Chroma/embeddings or the LLM is the slow part.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 4,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"histogram_quantile(0.95, sum by (le) (rate(rag_retrieval_seconds_bucket{job=\\\"rolechat-backend\\\"}[$__rate_interval])))\",\n          \"legendFormat\": \"retrieval (embed + Chroma)\",\n          \"refId\": \"A\"\n        },\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"histogram_quantile(0.95, sum by (le) (rate(rag_embedding_seconds_bucket{job=\\\"rolechat-backend\\\"}[$__rate_interval])))\",\n          \"legendFormat\": \"  of which: embedding call\",\n          \"refId\": \"B\"\n        },\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"histogram_quantile(0.95, sum by (le) (rate(rag_llm_seconds_bucket{job=\\\"rolechat-backend\\\"}[$__rate_interval])))\",\n          \"legendFormat\": \"Gemini answer\",\n          \"refId\": \"C\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\",\n          \"custom\": {\n            \"lineWidth\": 2,\n            \"fillOpacity\": 8,\n            \"spanNulls\": true,\n            \"showPoints\": \"auto\",\n            \"stacking\": {\n              \"mode\": \"none\",\n              \"group\": \"A\"\n            },\n            \"thresholdsStyle\": {\n              \"mode\": \"line\"\n            }\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 5\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      }\n    },\n    {\n      \"id\": 7,\n      \"type\": \"timeseries\",\n      \"title\": \"Requests by role (per min)\",\n      \"description\": \"\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 12,\n        \"w\": 8,\n        \"h\": 8\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"sum by (role) (rate(rag_chat_requests_by_role_total{job=\\\"rolechat-backend\\\"}[$__rate_interval])) * 60\",\n          \"legendFormat\": \"{{role}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"custom\": {\n            \"lineWidth\": 2,\n            \"fillOpacity\": 15,\n            \"spanNulls\": true,\n            \"showPoints\": \"auto\",\n            \"stacking\": {\n              \"mode\": \"normal\",\n              \"group\": \"A\"\n            }\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      }\n    },\n    {\n      \"id\": 8,\n      \"type\": \"timeseries\",\n      \"title\": \"Gemini errors (per min)\",\n      \"description\": \"rate_limited = 429s. Embedding errors include retries, so one request can add several.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"x\": 8,\n        \"y\": 12,\n        \"w\": 8,\n        \"h\": 8\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"sum by (stage, error_type) (rate(rag_gemini_errors_total{job=\\\"rolechat-backend\\\"}[$__rate_interval])) * 60\",\n          \"legendFormat\": \"{{stage}} / {{error_type}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"custom\": {\n            \"lineWidth\": 2,\n            \"fillOpacity\": 8,\n            \"spanNulls\": true,\n            \"showPoints\": \"auto\",\n            \"stacking\": {\n              \"mode\": \"none\",\n              \"group\": \"A\"\n            }\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      }\n    },\n    {\n      \"id\": 9,\n      \"type\": \"timeseries\",\n      \"title\": \"Gemini tokens (per min)\",\n      \"description\": \"Input = prompt + retrieved context. Output = the answer.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"x\": 16,\n        \"y\": 12,\n        \"w\": 8,\n        \"h\": 8\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"sum by (direction) (rate(rag_gemini_tokens_total{job=\\\"rolechat-backend\\\"}[$__rate_interval])) * 60\",\n          \"legendFormat\": \"{{direction}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"custom\": {\n            \"lineWidth\": 2,\n            \"fillOpacity\": 15,\n            \"spanNulls\": true,\n            \"showPoints\": \"auto\",\n            \"stacking\": {\n              \"mode\": \"normal\",\n              \"group\": \"A\"\n            }\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      }\n    },\n    {\n      \"id\": 10,\n      \"type\": \"timeseries\",\n      \"title\": \"/chat requests by status\",\n      \"description\": \"\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 20,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"sum by (status) (rate(http_requests_total{job=\\\"rolechat-backend\\\",handler=\\\"/chat\\\"}[$__rate_interval])) * 60\",\n          \"legendFormat\": \"{{status}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"custom\": {\n            \"lineWidth\": 2,\n            \"fillOpacity\": 15,\n            \"spanNulls\": true,\n            \"showPoints\": \"auto\",\n            \"stacking\": {\n              \"mode\": \"normal\",\n              \"group\": \"A\"\n            }\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      }\n    },\n    {\n      \"id\": 11,\n      \"type\": \"timeseries\",\n      \"title\": \"Empty retrievals by role (per min)\",\n      \"description\": \"Questions where no document matched the user's role. A spike can mean missing docs or a bad filter.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 20,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"sum by (role) (rate(rag_empty_retrieval_total{job=\\\"rolechat-backend\\\"}[$__rate_interval])) *\
    \ 60\",\n          \"legendFormat\": \"{{role}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"custom\": {\n            \"lineWidth\": 2,\n            \"fillOpacity\": 8,\n            \"spanNulls\": true,\n            \"showPoints\": \"auto\",\n            \"stacking\": {\n              \"mode\": \"none\",\n              \"group\": \"A\"\n            }\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      }\n    }\n  ]\n}"