name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

env:
  IMAGE_NAME: ${{ secrets.DOCKER_IMAGE }}

jobs:
  # ─────────────────────────────────────────
  # JOB 1: CI — Test + Build + Push
  # Runs on GitHub's cloud servers
  # ─────────────────────────────────────────
  ci:
    name: 🧪 Test + 🐳 Build + Push
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 🧪 Run tests
        run: pytest tests/ -v

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🐳 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ─────────────────────────────────────────
  # JOB 2: CD — Deploy to Minikube
  # Runs on YOUR local machine via self-hosted runner
  # ─────────────────────────────────────────
  cd:
    name: 📝 Bump image tag for ArgoCD
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
      - name: Bump image tag
        run: |
          cd k8s/base
          kustomize edit set image ${{ env.IMAGE_NAME }}=${{ env.IMAGE_NAME }}:${{ github.sha }}
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add k8s/base/kustomization.yaml
          git commit -m "chore: bump image to ${{ github.sha }} [skip ci]" || exit 0
          git push